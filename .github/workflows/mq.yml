name: mq
on:
  push:

jobs:
  mq:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mq: [activeMQ, rabbitmq/container, solace]
    steps:
      - uses: actions/checkout@main
      - run: docker compose up -d
        working-directory: ${{ matrix.mq }}
      
  broker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        broker: [pulsar, pulsar/standalone] # TODO find bitnami kafka alternative
    steps:
      - uses: actions/checkout@main
      - run: docker compose up -d
        working-directory: ${{ matrix.broker }}
  confluentinc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - run: ./control.sh
        working-directory: confluent/container/compose
